site_name: GUI Slider - User Manual
site_description: Blender addon for viewport slider controls
site_url: ""

theme:
  name: material
  language: ja
  palette:
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: ライトモードに切替
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: ダークモードに切替
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - md_in_html

nav:
  - 日本語:
    - 概要: ja/index.md
    - コンテナ / カラム: ja/containers.md
    - スライダー / ジョイスティック: ja/sliders.md
    - Quick View: ja/quick-view.md
    - Dual Controller: ja/dual-controller.md
    - Linked Driver: ja/linked-driver.md
    - その他 / プリファレンス: ja/other.md
  - English:
    - Overview: en/index.md
    - Containers / Columns: en/containers.md
    - Sliders / Joystick: en/sliders.md
    - Quick View: en/quick-view.md
    - Dual Controller: en/dual-controller.md
    - Linked Driver: en/linked-driver.md
    - Other / Preferences: en/other.md
